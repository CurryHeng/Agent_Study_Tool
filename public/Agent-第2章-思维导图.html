<html>
<head>

<title>AI Agent 第2章 · 上下文工程</title>
<style>

<body>
<svg id="mindmap"></svg>
<script src="lib/d3.min.js"></script>
<script src="lib/markmap-view.js"></script>
<script src="lib/markmap-toolbar.js"></script>
<script>
const markdown = `# AI Agent 第2章 · 上下文工程

## 核心命题
- 上下文决定 Agent 能力的上限
- 中等模型+好上下文 > 顶级模型+缺信息
- 团队文档化是 AI 原生的前提

## API 上下文结构
- 消息列表（messages）是核心
- 四种消息角色
  - system: 系统提示词（最高优先级）
  - user: 用户输入
  - assistant: 模型回复（文本/tool_calls）
  - tool: 工具执行结果
- 单轮对话: system + user → assistant
- 多轮工具调用: 带 tools 字段，ReAct 循环
- Agent 框架核心 = 管理 messages 列表

## KV Cache
- 原理: 缓存已计算 token 的 K、V 向量
- 新增 token 只算自身，复用缓存
- 三条核心准则
  - 系统提示词和工具定义定稿后别改
  - 动态信息追加到末尾
  - 使用标准 API 格式
- 四种错误模式
  - 动态系统提示词（时间戳写进 system）
  - 动态用户配置
  - 工具定义动态排序
  - 滑动窗口对话历史
- 最致命: 文本格式化（USER:/ASSISTANT:）
- KV Cache vs Prompt Cache
  - KV Cache: 推理内部，单次请求
  - Prompt Cache: API层，跨请求
  - 都依赖前缀不变性

## Chat Template
- API JSON → 模型 token 流
- 特殊标记: <|im_start|>, <|im_end|>
- 不同模型家族格式不同
- 解释了为什么必须用标准 API 格式

## 注意力机制
- Query（查询）: 当前词发出的搜索请求
- Key（键）: 每个词的标签
- Value（值）: 每个词的内容
- Q·K → 权重 → 加权 V
- 注意力储存池（Attention Sink）
  - 第一个 token 吸收 70%+ 权重
  - softmax 强制权重和=100%
- 位置偏好: 开头结尾权重高，中间被忽视
- Lost in the Middle

## 提示工程
- 语气与风格: 人格设计
- 结构化提示: XML + Markdown
- 流程驱动 vs 规则堆砌
- 业务规则细化: 产品经理深度参与
- Few-shot 示例: 难以用规则描述时给例子
- 工具定义设计: 边界、示例、性能提示

## 提示注入
- 本质: 外部内容伪装成系统指令
- 三类攻击
  - 直接注入: 用户消息嵌入指令
  - 间接注入: 网页/文档隐藏指令
  - 记忆注入: 持久化污染后续会话
- 防御: 来源标记、结构化角色、输入清洗

## Agent Skills
- 渐进式披露（Progressive Disclosure）
- 三层结构
  - 元数据: name + description（路由条件+反例）
  - 核心流程: SKILL.md 正文
  - 细则: 子文档和脚本
- 元数据目录在 system prompt
- 完整指令按需加载到对话末尾
- 兼容 KV Cache

## Agent 状态栏
- 理论基础: 上下文学习是检索而非推理
- 状态栏五类信息
  - 任务规划（TODO列表）
  - 侧信道信息（时间、位置）
  - 环境观察摘要
  - 工具调用计数
  - 系统状态
- 关键原则
  - 用代码维护，别用 LLM
  - 别删除原始上下文
  - 把准确率当生产指标
- 两种更新实现: 持久追加 vs 每轮替换

## 上下文压缩
- 两个动机
  - 长度和成本约束
  - 提升思考质量（更深层）
- 上下文腐化: 装得下但找不到
- 六种策略
  - 无压缩 → 溢出
  - 个体摘要 → 碎片化
  - 组合摘要 → 截断风险
  - 上下文感知压缩 → 最优
  - 带引用感知 → 可溯源
  - 自适应窗口 → 最大化保留
- 生产分层压缩（5层）
- 隔离优于压缩: 子Agent上下文隔离
- 压缩设计四原则
  - 信息价值非均匀分布
  - 语义完整性
  - 任务相关性
  - 压缩即理解`;

(async () => {
  const { markmap } = window;
  const { Markmap } = markmap;
  const transformer = new markmap.Transformer();
  const { root } = transformer.transform(markdown);
  const mm = Markmap.create("svg#mindmap", undefined, root);
  const toolbar = new markmap.Toolbar();
  toolbar.attach(mm);
  const el = toolbar.render();
  el.setAttribute("style", "position:absolute;bottom:20px;right:20px");
  document.body.append(el);
})();
</script>
</body>
</html>
